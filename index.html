 they reduce the number of decisions we have to make. It would be exhausting to compare every possible route or inspect every available film before acting. Delegating some choices is not, by itself, a failure of independence.\n\nThe difficulty begins when a recommendation becomes difficult to distinguish from a requirement. A suggested route may be displayed prominently while alternatives are hidden behind an extra menu. A learning platform may label one lesson \"the next step\" even though several lessons would suit the learner's goal. No explicit prohibition is needed. The design can make one option feel natural and the others feel like departures from an agreed plan.\n\nThis influence is not necessarily malicious. A designer must organise information somehow, and equal prominence for every option would often produce confusion rather than freedom. Defaults can protect users from unnecessary effort. The relevant question is therefore not whether an interface influences behaviour, but whether that influence is understandable, proportionate and open to correction.\n\nImagine a person using a language app before an important trip. The platform recommends a grammar lesson because its usual sequence gives that topic priority. The learner, however, needs to practise asking for directions. If the recommendation is presented as advice, the person can choose a more relevant activity. If leaving the sequence triggers warnings about lost progress, the platform has transformed a teaching preference into pressure.\n\nA similar tension appears in reminders. A quiet reminder may support an intention the user has already formed. Repeated alerts, escalating messages or a threatened loss of status can instead make the user respond to the system's demands. Both designs may increase the number of sessions recorded. That number alone does not reveal whether the user's original purpose has been served.\n\nMetrics can make the distinction harder to see. A team may measure success through return visits because they are easy to count. Yet a service that helps someone finish a task efficiently might reduce return visits. Likewise, a learner who takes a deliberate break may be making a sensible decision rather than displaying a problem that the product must repair. What is measurable and what is valuable can overlap without being identical.\n\nThere are practical ways to keep convenience from becoming unnecessary control. Recommendations can include a brief reason. Alternatives can remain visible and available without a penalty. Settings can be expressed in ordinary language rather than buried in technical categories. A reminder can be easy to stop, and stopping it need not be treated as a rejection of the user's wider goal.\n\nTransparency, however, should not mean overwhelming the user with explanations. A screen full of disclosures may technically provide information while making the central decision harder to understand. The explanation should answer a relevant question at the moment it matters: why this exercise, why this notification, why this permission? Further details can be offered without becoming an obstacle to ordinary use.\n\nUsers also have responsibilities, although those responsibilities should not excuse confusing design. It is worth occasionally asking whether a default still reflects one's needs. A plan chosen months ago may no longer suit a changed schedule. An automatic recommendation may be helpful in one situation and irrelevant in another. The ability to revise a choice is part of meaningful control, not evidence that the original choice was foolish.\n\nThe distinction becomes particularly important when a service is used over a long period. A small inconvenience repeated every day can gradually shape behaviour more than one dramatic warning. Reviewing the ordinary path through an interface therefore matters as much as reviewing its unusual events. A user's control should remain practical after the initial settings have been forgotten, not exist only as a possibility buried in a menu.\n\nUltimately, a useful tool does not need to be neutral in every possible sense. It can guide, encourage and simplify. But its guidance should remain recognisable as guidance. Convenience is most valuable when it removes avoidable effort while preserving the user's authority over the purpose of the activity. The best next step is not always the one a system has already placed at the top of the screen.","questions":[{"q":"What is the central concern?","options":["All recommendations are harmful","Guidance can quietly become pressure","Interfaces should show every option equally"],"answer":1,"why":"Автор различает полезное направление и незаметное принуждение."},{"q":"Why can return visits be a misleading metric?","options":["Useful efficiency may reduce visits","They cannot be counted","Only reminders cause visits"],"answer":0,"why":"Хороший сервис иногда позволяет решить задачу быстрее и возвращаться реже."},{"q":"Which design best follows the essay?","options":["Hide alternatives","Punish a changed plan","Explain recommendations and allow alternatives without penalties"],"answer":2,"why":"Понятная причина и свободные альтернативы сохраняют контроль пользователя."}],"phrases":{"by itself":{"en":"by itself","ru":"само по себе"},"rather than":{"en":"rather than","ru":"а не"},"worth occasionally asking":{"en":"worth asking","ru":"стоит спросить"},"at the moment":{"en":"at the moment","ru":"в тот момент"},"at the top":{"en":"at the top","ru":"в верхней части"}},"gloss":{"control":{"en":"control","ru":"контроль; возможность управлять"},"authority":{"en":"authority","ru":"право определять"},"default":{"en":"default","ru":"выбор по умолчанию"},"defaults":{"en":"default","ru":"варианты по умолчанию"},"return":{"en":"return","ru":"повторный"},"visits":{"en":"visit","ru":"посещение"},"standing":{"en":"stand","ru":"стоять"},"served":{"en":"serve","ru":"соответствовать; служить"},"neutral":{"en":"neutral","ru":"нейтральный"},"disclosures":{"en":"disclosure","ru":"пояснение; раскрытие информации"},"condition":{"en":"condition","ru":"условие"},"sensible":{"en":"sensible","ru":"разумный"},"like":{"en":"like","ru":"как; подобно"}},"author":"Wordly · самостоятельный текст","levelNote":"Редакторская оценка сложности, не сертификат CEFR","paragraphs":["A navigation app suggests a route, a streaming service recommends a film, and a learning platform chooses the next exercise. These services are useful partly because they reduce the number of decisions we have to make. It would be exhausting to compare every possible route or inspect every available film before acting. Delegating some choices is not, by itself, a failure of independence.","The difficulty begins when a recommendation becomes difficult to distinguish from a requirement. A suggested route may be displayed prominently while alternatives are hidden behind an extra menu. A learning platform may label one lesson \"the next step\" even though several lessons would suit the learner's goal. No explicit prohibition is needed. The design can make one option feel natural and the others feel like departures from an agreed plan.","This influence is not necessarily malicious. A designer must organise information somehow, and equal prominence for every option would often produce confusion rather than freedom. Defaults can protect users from unnecessary effort. The relevant question is therefore not whether an interface influences behaviour, but whether that influence is understandable, proportionate and open to correction.","Imagine a person using a language app before an important trip. The platform recommends a grammar lesson because its usual sequence gives that topic priority. The learner, however, needs to practise asking for directions. If the recommendation is presented as advice, the person can choose a more relevant activity. If leaving the sequence triggers warnings about lost progress, the platform has transformed a teaching preference into pressure.","A similar tension appears in reminders. A quiet reminder may support an intention the user has already formed. Repeated alerts, escalating messages or a threatened loss of status can instead make the user respond to the system's demands. Both designs may increase the number of sessions recorded. That number alone does not reveal whether the user's original purpose has been served.","Metrics can make the distinction harder to see. A team may measure success through return visits because they are easy to count. Yet a service that helps someone finish a task efficiently might reduce return visits. Likewise, a learner who takes a deliberate break may be making a sensible decision rather than displaying a problem that the product must repair. What is measurable and what is valuable can overlap without being identical.","There are practical ways to keep convenience from becoming unnecessary control. Recommendations can include a brief reason. Alternatives can remain visible and available without a penalty. Settings can be expressed in ordinary language rather than buried in technical categories. A reminder can be easy to stop, and stopping it need not be treated as a rejection of the user's wider goal.","Transparency, however, should not mean overwhelming the user with explanations. A screen full of disclosures may technically provide information while making the central decision harder to understand. The explanation should answer a relevant question at the moment it matters: why this exercise, why this notification, why this permission? Further details can be offered without becoming an obstacle to ordinary use.","Users also have responsibilities, although those responsibilities should not excuse confusing design. It is worth occasionally asking whether a default still reflects one's needs. A plan chosen months ago may no longer suit a changed schedule. An automatic recommendation may be helpful in one situation and irrelevant in another. The ability to revise a choice is part of meaningful control, not evidence that the original choice was foolish.","The distinction becomes particularly important when a service is used over a long period. A small inconvenience repeated every day can gradually shape behaviour more than one dramatic warning. Reviewing the ordinary path through an interface therefore matters as much as reviewing its unusual events. A user's control should remain practical after the initial settings have been forgotten, not exist only as a possibility buried in a menu.","Ultimately, a useful tool does not need to be neutral in every possible sense. It can guide, encourage and simplify. But its guidance should remain recognisable as guidance. Convenience is most valuable when it removes avoidable effort while preserving the user's authority over the purpose of the activity. The best next step is not always the one a system has already placed at the top of the screen."],"wordCount":712},{"id":"c1-question","level":"C1","title":"The Question Before the Evidence","ru":"Вопрос перед доказательствами","genre":"Эссе","focus":"Условия · оценка аргументов","text":"A neighbourhood group wants to know whether a new garden has improved life on its street. The question sounds straightforward. Members could ask residents whether they like the garden and publish the proportion who say yes. A favourable result would be encouraging. It would not, however, answer every question hidden inside the phrase \"improved life\".\n\nSome residents may value a quieter place to sit. Others may care about access, maintenance costs or opportunities to meet neighbours. A person might like the appearance of the garden while finding the entrance difficult to use. If all these experiences are compressed into one positive or negative answer, the result becomes easy to present but difficult to interpret. Agreement on a label is not necessarily agreement on what the label means.\n\nThe first task is therefore to make the question more precise. Is the group interested in satisfaction, actual use, social contact or accessibility? Each aim suggests different evidence. Counting visitors might help describe use, but it would not explain why some people stay away. Interviews might reveal barriers, while records of maintenance could clarify costs. No single method is automatically superior; its value depends on the claim it is meant to support.\n\nTiming creates another complication. If residents are asked during the opening celebration, enthusiasm may be unusually high. If they are asked after a week of heavy rain, the garden may seem less useful than usual. Neither moment is unreal. The problem is treating one moment as if it represented every season. Repeating observations under different conditions can provide a broader picture, though it also requires time and resources.\n\nComparison needs similar care. Suppose more neighbours speak to one another after the garden opens. The garden may have contributed, but other changes could matter as well. A new shop, a residents' festival or an unusually warm summer might also encourage conversation. Without considering such possibilities, the group risks attributing every improvement to the project it already wants to celebrate.\n\nThis caution can sound discouraging. Volunteers may feel that a modest local project is being held to an impossible standard. They do not have the budget for a large study, and they may reasonably prefer planting trees to designing questionnaires. The response should not be to demand certainty before action. It should be to keep the strength of the conclusion proportionate to the strength of the evidence.\n\nA statement such as \"Several residents told us that the garden helped them meet neighbours\" can be both modest and informative. It identifies the source of the information and limits the scope of the claim. \"The garden has solved social isolation\" goes much further. The second sentence may attract attention, but it also makes the project vulnerable to disappointment and overlooks people whose experience differs.\n\nNegative evidence deserves attention too. A resident who cannot enter comfortably is not merely an exception to an otherwise successful story. Their experience may reveal a specific problem that can be corrected. If the group treats criticism as disloyalty, it loses information needed to improve the project. Listening to a difficulty is compatible with valuing what has already been achieved.\n\nThere is a lesson here for personal progress records. A rising total of completed exercises tells a learner something about activity, not everything about understanding. To examine understanding, the learner might return to an unfamiliar example, explain a choice or use a construction in a different context. These observations need not become an elaborate examination. They simply need to match the question being asked.\n\nA useful report can describe both what has been observed and what remains unknown. That does not weaken the information already collected. It helps the next person decide which questions deserve further attention. When limits are written clearly, a later observation can add to the record rather than seem to contradict a claim of complete certainty. The report becomes a starting point for learning instead of a final announcement of success.\n\nEvidence becomes useful when we know what we want it to distinguish. Before collecting more numbers, it is worth asking which competing explanations or outcomes matter. A clearer question may lead to a smaller collection of more relevant information. It can also make uncertainty easier to describe. The aim is not to remove every doubt, but to prevent an attractive answer from concealing the question we never properly examined.","questions":[{"q":"Why is one satisfaction score insufficient?","options":["Residents have different meanings of improvement","Nobody can answer questions","Gardens never help"],"answer":0,"why":"Один показатель смешивает внешний вид, доступность, общение и другие цели."},{"q":"What should limited resources lead to?","options":["No action until certainty","Proportionate claims rather than exaggerated conclusions","Ignoring negative evidence"],"answer":1,"why":"Сила вывода должна соответствовать силе доказательств."},{"q":"What do completed exercises directly indicate?","options":["Complete mastery","A certified level","Activity, not all aspects of understanding"],"answer":2,"why":"Число выполненных заданий само по себе не описывает всё понимание."}],"phrases":{"as well":{"en":"as well","ru":"тоже; также"},"stay away":{"en":"stay away","ru":"не приходить; держаться в стороне"},"is being held to":{"en":"be held to","ru":"оцениваться по; быть обязанным соответствовать"},"attract attention":{"en":"attract attention","ru":"привлекать внимание"},"it is worth asking":{"en":"it is worth asking","ru":"стоит спросить"}},"gloss":{"garden":{"en":"garden","ru":"сад; зелёная зона"},"group":{"en":"group","ru":"группа жителей"},"records":{"en":"record","ru":"записи"},"interviews":{"en":"interview","ru":"интервью"},"use":{"en":"use","ru":"использование; пользоваться"},"like":{"en":"like","ru":"нравиться"},"counting":{"en":"count","ru":"подсчитывать"},"held":{"en":"hold","ru":"обязывать соответствовать (hold to)"},"standard":{"en":"standard","ru":"критерий; стандарт"},"record":{"en":"record","ru":"запись"},"construction":{"en":"construction","ru":"грамматическая конструкция"},"scope":{"en":"scope","ru":"охват утверждения"},"weight":{"en":"weight","ru":"значимость"},"isolations":{"en":"isolation","ru":"изоляция"}},"author":"Wordly · самостоятельный текст","levelNote":"Редакторская оценка сложности, не сертификат CEFR","paragraphs":["A neighbourhood group wants to know whether a new garden has improved life on its street. The question sounds straightforward. Members could ask residents whether they like the garden and publish the proportion who say yes. A favourable result would t have the budget for a large study, and they may reasonably prefer planting trees to designing questionnaires. The response should not be to demand certainty before action. It should be to keep the strength of the conclusion proportionate to the strength of the evidence.","A statement such as \"Several residents told us that the garden helped them meet neighbours\" can be both modest and informative. It identifies the source of the information and limits the scope of the claim. \"The garden has solved social isolation\" goes much further. The second sentence may attract attention, but it also makes the project vulnerable to disappointment and overlooks people whose experience differs.","Negative evidence deserves attention too. A resident who cannot enter comfortably is not merely an exception to an otherwise successful story. Their experience may reveal a specific problem that can be corrected. If the group treats criticism as disloyalty, it loses information needed to improve the project. Listening to a difficulty is compatible with valuing what has already been achieved.","There is a lesson here for personal progress records. A rising total of completed exercises tells a learner something about activity, not everything about understanding. To examine understanding, the learner might return to an unfamiliar example, explain a choice or use a construction in a different context. These observations need not become an elaborate examination. They simply need to match the question being asked.","A useful report can describe both what has been observed and what remains unknown. That does not weaken the information already collected. It helps the next person decide which questions deserve further attention. When limits are written clearly, a later observation can add to the record rather than seem to contradict a claim of complete certainty. The report becomes a starting point for learning instead of a final announcement of success.","Evidence becomes useful when we know what we want it to distinguish. Before collecting more numbers, it is worth asking which competing explanations or outcomes matter. A clearer question may lead to a smaller collection of more relevant information. It can also make uncertainty easier to describe. The aim is not to remove every doubt, but to prevent an attractive answer from concealing the question we never properly examined."],"wordCount":723},{"id":"c1-chess","level":"C1","title":"A Good Move in a Lost Game","ru":"Хороший ход в проигранной партии","genre":"Эссе","focus":"Уступка · процесс и результат","text":"After losing a chess game, a player describes the decisive move as obviously foolish. The reply that punished it now seems impossible to miss. Before the move was played, however, several continuations looked plausible, the clock was running and one defensive resource was difficult to recognise. The final result has changed the way the earlier decision is being judged.\n\nThis is not an argument for excusing every mistake. A move may genuinely ignore a clear threat or rely on an unsupported assumption. The question is how to identify the defect without pretending that the outcome was already known. A useful review attempts to recover the information available at the moment of choice. Otherwise, hindsight can make analysis sound convincing while teaching very little.\n\nBegin by describing the player's actual reasoning, if it can be remembered. Which candidate moves were considered? What reply was expected? Which variation was examined, and where did the calculation stop? These questions reveal more than a simple label such as \"bad move\". The player may have found the right idea but miscalculated its timing, or calculated accurately after overlooking a stronger alternative.\n\nAn engine can help expose what was missed, but its evaluation is not a complete explanation of the human error. Seeing that a position changed from favourable to unfavourable does not show whether the problem was tactical blindness, an incorrect strategic assumption or poor time management. The displayed number describes the engine's assessment under its analysis conditions. The learner still needs to connect the variation to a practical lesson.\n\nThere is a corresponding danger after a win. A successful attack may have worked only because the opponent missed a straightforward defence. If the winner concludes that the plan was sound, the same idea may fail against a more careful player. Reviewing wins can therefore be uncomfortable: it removes some of the certainty that makes victory satisfying. Yet that discomfort may be exactly what makes the review useful.\n\nIt helps to separate three questions. Was the move objectively strong under accurate play? Was it reasonable given the player's available time and understanding? What change in the player's process would make a better decision more likely next time? These questions can produce different answers without contradicting one another. A practical choice may be defensible even when analysis later reveals a superior move.\n\nSuppose a player rejects a complicated winning line because there are only seconds left on the clock. They choose a simpler continuation that preserves a clear advantage. An engine might prefer the complicated line, but following that preference without reliable calculation could be a worse practical decision. This does not make accuracy irrelevant. It places accuracy alongside the conditions in which a person must act.\n\nBy contrast, a player who repeatedly moves without checking an obvious forcing reply has identified a process worth changing. The remedy need not be a lengthy ritual before every move. It might be a short pause when a piece leaves an important defensive square, or deliberate practice with positions where a distant piece creates an immediate threat. The practice should address the mechanism of the error, not merely recreate the unpleasant feeling of losing.\n\nKeeping a brief decision record can assist this work. Write the intended plan before examining the engine's line, then note the missing resource in ordinary language. Avoid rewriting the original thought to make it sound more sophisticated. An honest record of incomplete reasoning is more useful than a polished account produced after the answer is known. Over several games, recurring patterns may become visible.\n\nThis approach also changes how a player asks for advice. Rather than requesting the single best move, they can explain where their reasoning became uncertain and ask what feature of the position deserved attention. A stronger player may then offer a question that applies beyond this particular game. The answer is no longer only a move to remember; it is a way to examine another position without already knowing its result.\n\nThe purpose of review is not to prove that the player should have seen everything. It is to make the next act of seeing a little more reliable. Results still matter: the rules of chess do not award points for a thoughtful explanation after defeat. But learning from results requires distinguishing what happened from how the decision was made. A lost game can contain a good move, and a won game can contain a lesson that victory initially hides.","questions":[{"q":"What does hindsight risk doing?","options":["Making the past decision seem easier than it was","Removing the result","Stopping all analysis"],"answer":0,"why":"Знание результата меняет оценку доступной тогда информации."},{"q":"Why is an engine evaluation not a full explanation?","options":["Engines cannot calculate","It does not identify the human reasoning error by itself","Only winning games can be analysed"],"answer":1,"why":"Число не объясняет, почему человек пропустил идею или неверно оценил позицию."},{"q":"What should a decision record preserve?","options":["Only the final engine move","A polished version written after seeing the answer","The original reasoning before consulting the answer"],"answer":2,"why":"Важно честно записать исходный план до просмотра анализа."}],"phrases":{"given the":{"en":"given","ru":"с учётом"},"by contrast":{"en":"by contrast","ru":"в отличие от этого"},"on the clock":{"en":"on the clock","ru":"на часах"},"left on the clock":{"en":"left on the clock","ru":"оставшийся на часах"},"next time":{"en":"next time","ru":"в следующий раз"},"at the moment":{"en":"at the moment","ru":"в тот момент"}},"gloss":{"resource":{"en":"resource","ru":"возможность защиты; ресурс"},"resources":{"en":"resource","ru":"возможности защиты"},"line":{"en":"line","ru":"рассчитанный вариант ходов"},"variation":{"en":"variation","ru":"вариант продолжения"},"variations":{"en":"variation","ru":"варианты продолжения"},"move":{"en":"move","ru":"шахматный ход"},"moves":{"en":"move","ru":"ходы"},"piece":{"en":"piece","ru":"шахматная фигура"},"square":{"en":"square","ru":"поле доски"},"forcing":{"en":"forcing","ru":"форсированный; вынуждающий"},"favourable":{"en":"favourable","ru":"выгодный"},"unfavourable":{"en":"unfavourable","ru":"невыгодный"},"engine":{"en":"engine","ru":"шахматный движок"},"assessment":{"en":"assessment","ru":"оценка позиции"},"record":{"en":"record","ru":"запись"},"play":{"en":"play","ru":"игра"},"strong":{"en":"strong","ru":"сильный"},"last":{"en":"last","ru":"последний"},"left":{"en":"left","ru":"оставшийся"},"points":{"en":"point","ru":"очко"},"blindness":{"en":"blindness","ru":"неспособность заметить"}},"author":"Wordly · самостоятельный текст","levelNote":"Редакторская оценка сложности, не сертификат CEFR","paragraphs":["After losing a chess game, a player describes the decisive move as obviously foolish. The reply that punished it now seems impossible to miss. Before the move was played, however, several continuations looked plausible, the clock was running and one defensive resource was difficult to recognise. The final result has changed the way the earlier decision is being judged.","This is not an argument for excusing every mistake. A
