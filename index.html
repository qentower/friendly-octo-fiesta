<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#f4f6fa"><meta name="apple-mobile-web-app-capable" content="yes"><title>Wordly · английский</title><style>
:root{--bg:#0b0b0e;--card:#17171c;--card2:#202027;--line:#2c2c35;--tx:#f2f2f6;--mu:#8d8d99;--y:#f7c948;--b:#4c8dff;--g:#55c46a;--r:#ff5d5d;--p:#9b7bff;--t:#2ec4b6;--o:#ff9f43}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1{font-size:30px;margin:8px 0}h2{font-size:22px;margin:24px 0 10px}h3{margin:18px 0 8px}
.muted{color:var(--mu)}.small{font-size:13px}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:10px 22px;background:rgba(11,11,14,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-size:18px}.logo span{color:var(--mu);font-size:13px}
#nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.nav-btn{padding:8px 14px;border-radius:12px;color:var(--mu)}.nav-btn:hover{background:var(--card)}.nav-btn.on{background:var(--card2);color:var(--tx)}
.streak-box{display:flex;gap:14px;color:var(--y);font-weight:600}
body.in-session .topbar{display:none}
main{max-width:1000px;margin:0 auto;padding:20px}
.page{max-width:900px;margin:0 auto}
/* цвета частей речи */
.tc-s{color:var(--b)}.tc-v{color:var(--g)}.tc-a{color:var(--y)}.tc-n{color:var(--r)}.tc-q{color:var(--p)}.tc-t{color:var(--t)}.tc-p{color:var(--o)}
.chip{display:inline-block;padding:2px 10px;border-radius:8px;font-size:14px;font-weight:600;background:var(--card2);color:var(--tx)}
.c-s{background:var(--b)}.c-v{background:var(--g)}.c-a{background:var(--y);color:var(--tx)}.c-n{background:var(--r)}.c-q{background:var(--p)}.c-t{background:var(--t);color:var(--tx)}.c-p{background:var(--o);color:var(--tx)}.c-o{background:var(--card2)}
.c-t{color:var(--tx)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.legend .chip{font-size:12px}.legend.big .chip{font-size:14px}
/* карта */
.level-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lvl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.lvl.on{border-color:var(--y);background:var(--card2)}.lvl small{color:var(--mu)}
.lvl-bar{height:6px;border-radius:4px;background:var(--card2);overflow:hidden}.lvl-bar i{display:block;height:100%;background:var(--y)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:24px 0 10px;flex-wrap:wrap}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding:20px 0 80px;background:radial-gradient(ellipse at top,#1a1a22,transparent 60%)}
.node{position:relative;width:190px;height:190px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;
 background:radial-gradient(circle at 30% 25%,#5a4a26,#2b2416 70%);border:6px solid var(--line);box-shadow:0 0 0 4px #6b5520,0 10px 30px rgba(0,0,0,.5);transition:transform .15s}
.node:hover{transform:scale(1.05)}
.node small{color:var(--tx);font-size:12px}.n-title{font-weight:700;font-size:14.5px;line-height:1.2;margin-top:2px}.n-title.big{font-size:18px}
.n-emoji{font-size:30px;line-height:1}
.n-stars{margin-top:6px;font-size:22px;letter-spacing:2px;color:var(--tx)}.n-stars .on{color:var(--y);text-shadow:0 0 8px #f7c94888}
.node.cp{border-radius:28px;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);background:linear-gradient(160deg,#f7d46a,#e3a92c);color:var(--tx);border:0;box-shadow:none}
.node.cp small{color:var(--tx)}.node.cp .n-stars{color:var(--tx)}.node.cp .n-stars .on{color:var(--tx)}
.node.cert{border-radius:30px;background:linear-gradient(160deg,#7fb0ff,#3d6fe0);border:0;box-shadow:0 0 30px #4c8dff55}
.node.cert small{color:var(--tx)}
.node.locked{filter:grayscale(1) brightness(.55);border-color:var(--tx);box-shadow:none}
.node.next{box-shadow:0 0 0 4px #6b5520,0 0 40px #f7c94877}
.soon{position:absolute;bottom:-12px;background:var(--card2);color:var(--tx);font-size:12px;padding:2px 10px;border-radius:10px}
.go{position:absolute;bottom:-16px;background:var(--y);color:var(--tx);font-weight:700;padding:6px 18px;border-radius:14px;font-size:14px}
/* кнопки */
.main-btn{padding:13px 26px;border-radius:16px;font-weight:700;background:var(--card2);min-width:180px}
.main-btn.blue{background:var(--b);color:var(--tx)}.main-btn.green{background:var(--g);color:var(--tx)}.main-btn.red{background:var(--r);color:var(--tx)}
.main-btn.ghost{background:var(--card2);border:1px solid var(--line)}.main-btn.small{padding:8px 16px;min-width:0;font-size:14px}
.main-btn:disabled{background:var(--card2);color:var(--tx);cursor:default}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--card2);font-size:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}
/* сессия */
.session{max-width:760px;margin:0 auto;min-height:calc(100vh - 40px);display:flex;flex-direction:column}
.session-top{display:flex;align-items:center;gap:14px;padding:6px 0 10px}
.session-title{color:var(--mu);font-size:13px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.progress{flex:1;height:10px;background:var(--card2);border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--y);transition:width .3s}
.session-body{flex:1;padding:10px 0}
.session-foot{position:sticky;bottom:0;padding:12px 0 18px;background:linear-gradient(transparent,var(--bg) 25%);display:flex;flex-direction:column;align-items:center;gap:12px}
.step.anim{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.step-title{font-size:24px;margin:6px 0 14px}
.formula{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.formula.small{padding:10px 14px}.f-hint{color:var(--tx);font-size:14px;margin-bottom:8px}
.f-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}.plus{color:var(--mu)}
.rule-text{color:var(--tx);line-height:1.6;margin:10px 0}.card{background:var(--card);border-radius:16px;padding:14px 16px;border:1px solid var(--line)}
.center-step{text-align:center;padding-top:30px}.center-step .formula,.center-step .rule-text{text-align:left}
.stars-intro{font-size:46px;color:var(--tx)}.stars-intro span:first-child{color:var(--y)}
.big-emoji{font-size:64px}
.prompt{display:flex;gap:10px;align-items:flex-start;font-size:21px;margin:14px 0 18px}.bubble{font-size:20px}
.sent .tw{position:relative}.sent.big{font-size:20px}
.has-tip{border-bottom:2px dotted #666;cursor:help}
.tip{display:none;position:absolute;left:50%;top:120%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:8px 12px;border-radius:12px;white-space:nowrap;font-size:15px;z-index:3;color:var(--tx);font-weight:600}
.tip small{display:block;color:var(--mu);font-weight:400;font-size:11px}
.has-tip:hover .tip{display:block}
.answer-line{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;margin-bottom:22px;align-items:center}
.placeholder{color:var(--tx);font-size:14px}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{padding:10px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:18px;transition:.12s}
.tile:hover{border-color:var(--tx)}.tile.ghost{opacity:.15;pointer-events:none}
.tc-bg-s{background:var(--b);border-color:var(--b)}.tc-bg-v{background:var(--g);border-color:var(--g);color:var(--tx)}.tc-bg-a{background:var(--y);border-color:var(--y);color:var(--tx)}
.tc-bg-n{background:var(--r);border-color:var(--r)}.tc-bg-q{background:var(--p);border-color:var(--p)}.tc-bg-t{background:var(--t);border-color:var(--t);color:var(--tx)}.tc-bg-p{background:var(--o);border-color:var(--o);color:var(--tx)}
.type-input{width:100%;font:inherit;font-size:20px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:14px;resize:vertical;outline:none}
.type-input:focus{border-color:var(--b)}
.choice-sent{font-size:24px;background:var(--card);border-radius:16px;padding:22px;text-align:center;margin:18px 0}
.blank{display:inline-block;min-width:60px;padding:0 10px;border-radius:8px;background:var(--b);color:var(--tx)}
.blank.ok{background:var(--g);color:var(--tx)}.blank.bad{background:var(--r)}
.options{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}.options.col{flex-direction:column;align-items:stretch;max-width:520px;margin:20px auto 0}
.opt{padding:13px 24px;border-radius:14px;background:var(--b);color:var(--tx);font-weight:600;font-size:17px;min-width:130px}.opt small{opacity:.75;font-weight:400}
.opt.green{background:var(--g);color:var(--tx)}.opt.ok{background:var(--g);color:var(--tx)}.opt.bad{background:var(--r);color:var(--tx);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.drill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px;margin:12px 0}
.drill-row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:9px 6px;border-bottom:1px solid var(--line);font-size:18px}.drill-row:last-child{border:0}
.drill-row.cur{background:var(--card2);border-radius:10px;font-weight:700}.dc:nth-child(2){text-align:center}.dc:nth-child(3){text-align:right}
.drill-row .dc:not(.tc-s):not(.tc-v){color:var(--tx)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:20px auto}
.pair{padding:16px;border-radius:14px;background:var(--card2);border:2px solid var(--line);font-size:17px}
.pair.sel{border-color:var(--b)}.pair.done{border-color:var(--g);color:var(--g);opacity:.35;pointer-events:none}.pair.bad{border-color:var(--r);animation:shake .3s}
.feedback{width:100%;border-radius:18px;padding:14px 18px;background:var(--card2);border:1px solid var(--line)}
.feedback.hidden{display:none}.feedback.bad{background:var(--card2);border-color:var(--tx)}
.fb-head{font-size:22px;font-weight:800;color:var(--g)}.feedback.bad .fb-head{color:var(--r)}
.fb-line{margin:4px 0;color:var(--tx)}.feedback.bad .fb-line{color:var(--tx)}
.streak{color:var(--g);font-size:13px;font-weight:700}
.explain-btn{margin-top:10px;width:100%;padding:10px;border-radius:12px;border:1px solid var(--p);color:var(--tx);font-weight:600}
.explain{margin-top:10px;background:var(--card2);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.note{background:var(--card2);border-radius:10px;padding:8px 12px;margin:8px 0;color:var(--tx)}
/* финиш */
.finish{text-align:center;max-width:520px;margin:40px auto}.fw{font-size:40px}.big-star{font-size:110px;line-height:1;animation:pop .5s}
@keyframes pop{from{transform:scale(.3)}70%{transform:scale(1.15)}}
.res-stars{font-size:44px;color:var(--tx);letter-spacing:6px}.res-stars .on{color:var(--y)}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.stat{background:var(--card);border-radius:14px;padding:10px 16px;font-weight:700;font-size:18px}.stat small{display:block;font-size:11px;letter-spacing:1px}
.stat.y small{color:var(--y)}.stat.p small{color:var(--p)}.stat.g small{color:var(--g)}.stat.b small{color:var(--b)}
.finish .row{justify-content:center}
/* справочник */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;border-top:4px solid var(--y)}
.tcard.g-Continuous{border-top-color:var(--b)}.tcard.g-Perfect{border-top-color:var(--g)}.tcard.g-PerfectContinuous{border-top-color:var(--p)}
.tcard.compact{margin-bottom:10px}
.tc-head{display:flex;flex-direction:column}.tc-head b{font-size:18px}.tc-head span{font-size:13px}
.tc-use{font-size:14px;margin:6px 0;color:var(--tx)}.tc-mk{font-size:13px;color:var(--mu);margin-top:6px}.tc-mk .tc-t{font-weight:600}
.tc-frow{display:flex;align-items:center;gap:6px}.tc-frow .formula{margin:3px 0;padding:6px 8px;flex:1;background:var(--card2)}.tc-frow .chip{font-size:11.5px;padding:1px 6px}
.sign{width:16px;font-weight:800;color:var(--mu)}
.tc-ex{font-size:14px;margin-top:8px;display:grid;gap:3px}
.timeline{width:100%;height:62px;margin:4px 0}
.tl-axis{stroke:#555;stroke-width:2}.tl-head{fill:#555}.tl-now{stroke:var(--r);stroke-width:2;stroke-dasharray:3 3}
.tl-lbl{fill:#777;font-size:10px}.tl-dot{fill:var(--y)}.tl-ref{fill:none;stroke:#fff;stroke-width:2}
.tl-wave{fill:none;stroke:var(--b);stroke-width:3}.tl-arrow{fill:none;stroke:var(--g);stroke-width:2;stroke-dasharray:4 3}
.tchip{padding:2px 10px;border-radius:8px;background:var(--y);color:var(--tx);font-size:16px}
.tchip.g-Continuous{background:var(--b);color:var(--tx)}.tchip.g-Perfect{background:var(--g);color:var(--tx)}.tchip.g-PerfectContinuous{background:var(--p);color:var(--tx)}
.search{width:100%;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--tx);font:inherit;margin-bottom:12px}
.rule-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}
.rule-item summary{cursor:pointer;font-weight:600}.rule-block{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.ex-list{font-size:15px;display:grid;gap:4px;margin-bottom:8px}
/* тренажёр */
.tt-grid{display:grid;grid-template-columns:150px repeat(3,1fr);gap:8px;align-items:center}
.tt-grid>b{font-size:13px;color:var(--mu)}
.tt-cell{padding:12px 8px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:14px;opacity:.6}
.tt-cell.on{opacity:1;border-color:var(--y)}.tt-cell.on.g-Continuous{border-color:var(--b)}.tt-cell.on.g-Perfect{border-color:var(--g)}.tt-cell.on.g-PerfectContinuous{border-color:var(--p)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tg{padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px}.tg.on{border-color:var(--b);background:var(--card2)}
.chk{display:block;margin:14px 0;color:var(--tx)}
.sel{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px}
.mist-list{display:grid;gap:8px;margin:12px 0}.mist{background:var(--card);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);padding:12px 18px;border-radius:12px;z-index:9;box-shadow:0 6px 20px #0008}
@media (max-width:700px){.level-tabs{grid-template-columns:1fr 1fr}.node{width:160px;height:160px}.topbar{flex-wrap:wrap}.tt-grid{grid-template-columns:90px repeat(3,1fr)}}
/* ===== v2 ===== */
:root{--ks:var(--b);--kv:var(--g);--ka:var(--y);--kn:var(--r);--kp:var(--o);--kq:var(--p);--ko:#55555f}

body{font-family:SFR,"Segoe UI",Roboto,Arial,sans-serif}
.nav-btn.due{color:var(--y)}
.spk{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--card2);margin-left:8px;font-size:16px;vertical-align:middle;flex:none}
.spk:hover{background:var(--card2)}.spk.big{width:84px;height:84px;font-size:38px;margin:0;background:var(--b)}
.listen-box{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0}
.orule{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 22px;font-size:20px;line-height:1.9}
.orule.small{font-size:16px;padding:12px 16px;line-height:1.75;margin:10px 0}
.orule .chip{font-size:.85em;padding:1px 10px;margin:0 2px}.orule .plus{color:var(--mu);margin:0 4px;font-weight:700}
.chip.c-p{color:var(--tx)}.chip.c-a{color:var(--tx)}.chip.c-o{background:var(--card2)}
.rule-step .rule-num{color:var(--y);font-weight:700;margin-bottom:10px;letter-spacing:.5px}
.task-sent .tw{position:relative;cursor:default}.task-sent .tw.has-tip{border-bottom:1px dashed #666}
.tw .tip{display:none;position:absolute;left:50%;bottom:120%;transform:translateX(-50%);background:var(--card2);color:var(--tx);padding:5px 10px;border-radius:8px;font-size:14px;white-space:nowrap;z-index:3;font-weight:400}
.tw:hover .tip{display:block}
.gapslot{min-width:70px;display:inline-block}.blank.ok{color:var(--g)}.blank.bad{color:var(--r)}
.aw u{text-decoration-thickness:3px;text-underline-offset:3px}
.ans-sent{font-weight:600}
.drill-row{display:flex;flex-direction:column;gap:2px;grid-template-columns:none}
.drill-row.done{opacity:.75}.q-sent{font-size:19px}.blank.cur{color:var(--y)}
.options.tf .opt{min-width:180px}.opt.redb{border-color:var(--tx)}
.banner-img{width:180px;height:180px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px var(--lc,#e9c25a)}
/* слова */
.wcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:440px;margin:12px auto;text-align:center}
.w-img{width:220px;height:160px;object-fit:cover;border-radius:16px;margin-bottom:6px}.w-img.sm{width:160px;height:110px}
.w-en{font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center}.w-tr{color:var(--mu)}.w-ru{font-size:22px;color:var(--y)}
.w-forms{font-size:15px}.w-ex{margin-top:8px;font-size:16px}.w-ex .hl{color:var(--g)}
.w-q{display:flex;flex-direction:column;align-items:center;margin:16px 0}
.type-input.one{font-size:22px;padding:14px;width:100%}
.boxbar{display:inline-flex;gap:2px}.boxbar i{width:8px;height:12px;border-radius:2px;background:var(--card2)}.boxbar i.on{background:var(--g)}
.wlist{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.wrow{display:grid;grid-template-columns:44px 1.2fr 1fr 1.6fr auto 70px 36px;align-items:center;gap:8px;background:var(--card);padding:6px 10px;border-radius:12px}
.icon-btn.sm{width:30px;height:30px;font-size:14px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.set{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;align-items:center}.set.on{border-color:var(--g)}
.set-img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}.set-b{display:flex;flex-direction:column;gap:4px}
.stats.left{justify-content:flex-start}
.hero-l{display:flex;gap:16px;align-items:center}.lv-img{width:90px;height:90px;object-fit:contain}
/* диалоги */
.chat{display:flex;flex-direction:column;gap:8px;margin:12px 0;max-height:46vh;overflow:auto}
.msg{max-width:75%;padding:10px 14px;border-radius:16px;font-size:18px}.msg small{display:block}
.msg.them{background:var(--card2);align-self:flex-start;border-bottom-left-radius:4px}.msg.me{background:var(--card2);align-self:flex-end;border-bottom-right-radius:4px}
/* карта v2 */
.lvl.on{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 12%,var(--card))}.lvl-bar i{background:var(--lc)}
.node2{display:flex;flex-direction:column;align-items:center;gap:4px;width:220px}
.n-circle{position:relative;width:150px;height:150px;border-radius:50%;background:var(--card2);border:6px solid var(--line);display:flex;align-items:center;justify-content:center;transition:transform .15s;box-shadow:0 8px 24px rgba(0,0,0,.5)}

<script>
window.WORDLY_READ={"version":1,"books":[{"id":"a1-day","level":"A1","title":"A Quiet Sunday","ru":"Тихое воскресенье","genre":"История","focus":"Present Simple · распорядок дня","text":"Mia lives in a small town. She works in a shop from Monday to Friday. On Sunday, she does not work. She has breakfast at home and opens the window. The street is quiet.\n\nMia has a blue bag. In the bag, there is a book, a bottle of water and an apple. She walks to the park. Her friend Ben is there. He has a small dog. The dog likes the grass, but it does not like the water.\n\nMia and Ben sit under a tree. They talk about their week. Mia reads a page of her book. Ben drinks some water. At twelve, they go to a cafe. Mia wants soup. Ben wants a sandwich.\n\nAfter lunch, Mia goes home. She calls her sister. They talk for ten minutes. Then Mia makes tea. It is a simple day, and she is happy.","questions":[{"q":"Where does Mia work?","options":["In a shop","In a school","In a cafe"],"answer":0,"why":"В начале сказано: She works in a shop."},{"q":"What does Ben have?","options":["A blue bag","A small dog","An apple"],"answer":1,"why":"Ben has a small dog."},{"q":"What does Mia want for lunch?","options":["Tea","A sandwich","Soup"],"answer":2,"why":"В кафе Mia wants soup."}],"phrases":{"at home":{"en":"at home","ru":"дома"},"goes home":{"en":"go home","ru":"идти домой"}},"gloss":{"works":{"en":"work","ru":"работать"},"has":{"en":"have","ru":"иметь"},"does":{"en":"do","ru":"вспомогательный глагол для отрицания в Present Simple"},"some":{"en":"some","ru":"немного"},"like":{"en":"like","ru":"нравиться"},"for":{"en":"for","ru":"в течение"},"page":{"en":"page","ru":"страница"}},"author":"Wordly · самостоятельный текст","levelNote":"Редакторская оценка сложности, не сертификат CEFR","paragraphs":["Mia lives in a small town. She works in a shop from Monday to Friday. On Sunday, she does not work. She has breakfast at home and opens the window. The street is quiet.","Mia has a blue bag. In the bag, there is a book, a bottle of water and an apple. She walks to the park. Her friend Ben is there. He has a small dog. The dog likes the grass, but it does not like the water.","Mia and Ben sit under a tree. They talk about their week. Mia reads a page of her book. Ben drinks some water. At twelve, they go to a cafe. Mia wants soup. Ben wants a sandwich.","After lunch, Mia goes home. She calls her sister. They talk for ten minutes. Then Mia makes tea. It is a simple day, and she is happy."],"wordCount":144},{"id":"a1-cat","level":"A1","title":"The Cat at the Door","ru":"Кот у двери","genre":"История","focus":"There is · место и описание","text":"There is a cat at Leo's door. It is grey and very small. Leo opens the door, but the cat stays outside. It looks at him.\n\nLeo puts a bowl of water near the door. The cat drinks. Then Leo looks at the cat's neck. There is a little green tag. A name is on the tag: Pip. There is a phone number too.\n\nLeo calls the number. A woman answers. Her name is Anna. Pip is her cat. Her house is near the station. She is very happy.\n\nAnna comes to Leo's house with a yellow box. Pip knows her and walks to the box. Anna says thank you. Leo smiles.\n\nThe next morning, Leo walks to the shop. He sees Anna at her window. Pip sits next to her. The cat is at home now.","questions":[{"q":"What colour is the tag?","options":["Grey","Green","Yellow"],"answer":1,"why":"Описан little green tag."},{"q":"How does Leo find Anna?","options":["He calls the number on the tag","He goes to the station","He reads a book"],"answer":0,"why":"Leo calls the number."},{"q":"Where is Pip at the end?","options":["At the station","Outside the shop","At home"],"answer":2,"why":"Последнее предложение: The cat is at home now."}],"phrases":{"next to":{"en":"next to","ru":"рядом с"},"thank you":{"en":"thank you","ru":"спасибо"},"at home":{"en":"at home","ru":"дома"}},"gloss":{"tag":{"en":"tag","ru":"бирка на ошейнике"},"there":{"en":"there","ru":"есть; имеется (there is)"},"stays":{"en":"stay","ru":"оставаться"},"number":{"en":"number","ru":"номер телефона"}},"author":"Wordly · самостоятельный текст","levelNote":"Редакторская оценка сложности, не сертификат CEFR","paragraphs":["There is a cat at Leo's door. It is grey and very small. Leo opens the door, but the cat stays outside. It looks at him.","Leo puts a bowl of water near the door. The cat drinks. Then Leo looks at the cat's neck. There is a little green tag. A name is on the tag: Pip. There is a phone number too.","Leo calls the number. A woman answers. Her name is Anna. Pip is her cat. Her house is near the station. She is very happy.","Anna comes to Leo's house with a yellow box. Pip knows her and walks to the box. Anna says thank you. Leo smiles.","The next morning, Leo walks to the shop. He sees Anna at her window. Pip sits next to her. The cat is at home now."],"wordCount":137},{"id":"a1-cafe","level":"A1","title":"Two Cups of Tea","ru":"Две чашки чая","genre":"Диалог и история","focus":"Can · вежливая просьба","text":"Nora and Sam are in a cafe. It is cold outside, but the cafe is warm. There are three tables near the window. Nora and Sam sit at a small table.\n\nA waiter comes to them. \"Hello. What would you like?\" he asks.\n\n\"Can I have some tea, please?\" Nora says. \"And a cheese sandwich.\"\n\n\"Tea for me too,\" says Sam. \"But no sandwich. I want an apple cake.\"\n\nThe waiter brings two cups of tea, a sandwich and a cake. Nora puts milk in her tea. Sam does not want milk. They eat and talk.\n\nThen Sam looks in his bag. His wallet is not there. \"Oh no,\" he says. Nora has her wallet. She can pay today.\n\n\"Thank you,\" Sam says. \"Next time, the tea is on me!\"","questions":[{"q":"What does Sam order?","options":["Tea and an apple cake","Milk and a sandwich","Water and cheese"],"answer":0,"why":"Sam заказывает tea и apple cake."},{"q":"Why does Nora pay?","options":["Sam is asleep","Sam does not have his wallet","The waiter asks her"],"answer":1,"why":"Кошелька Сэма нет в сумке."},{"q":"Who puts milk in the tea?","options":["Sam","The waiter","Nora"],"answer":2,"why":"Nora puts milk in her tea."}],"phrases":{"would you like":{"en":"would you like","ru":"вы бы хотели"},"can i have":{"en":"can I have","ru":"можно мне"},"on me":{"en":"on me","ru":"за мой счёт"},"next time":{"en":"next time","ru":"в следующий раз"}},"gloss":{"like":{"en":"like","ru":"хотеть (would like)"},"no":{"en":"no","ru":"без; никакой"},"order":{"en":"order","ru":"заказ"},"on":{"en":"on","ru":"за счёт (on me)"}},"author":"Wordly · самостоятельный текст","levelNote":"Редакторская оценка сложности, не сертификат CEFR","paragraphs":["Nora and Sam are in a cafe. It is cold outside, but the cafe is warm. There are three tables near the window. Nora and Sam sit at a small table.","A waiter comes to them. \"Hello. What would you like?\" he asks.","\"Can I have some tea, please?\" Nora says. \"And a cheese sandwich.\"","\"Tea for me too,\" says Sam. \"But no sandwich. I want an apple cake.\"","The waiter brings two cups of tea, a sandwich and a cake. Nora puts milk in her tea. Sam does not want milk. They eat and talk.","Then Sam looks in his bag. His wallet is not there. \"Oh no,\" he says. Nora has her wallet. She can pay today.","\"Thank you,\" Sam says. \"Next time, the tea is on me!\""],"wordCount":130},{"id":"a1-mouse","level":"A1","title":"A Small Friend","ru":"Маленький друг","genre":"Басня · собственный пересказ","focus":"Can / cannot · способности","text":"A lion sleeps under a tree. A little mouse runs over his foot. The lion opens his eyes. He catches the mouse.\n\n\"Please let me go,\" says the mouse. \"I can help you one day.\"\n\nThe lion laughs. \"You are very small. I am very big. How can you help me?\" But he opens his hand, and the mouse runs away.\n\nOne day, the lion is in a net. He cannot move. He calls for help. The mouse hears him and comes to the tree.\n\n\"I can help,\" says the mouse. She bites the net with her small teeth. She works and works. Now there is a hole in the net. The lion can get out.\n\n\"Thank you, my friend,\" he says. The mouse smiles. A small friend can do a big thing.","questions":[{"q":"Why does the lion laugh?","options":["The mouse has a funny hat","He thinks the mouse is too small to help","He sees another lion"],"answer":1,"why":"Лев противопоставляет small и big."},{"q":"What does the mouse bite?","options":["The tree","The lion","The net"],"answer":2,"why":"She bites the net."},{"q":"What is the main idea?","options":["Small friends can help too","Lions do not sleep","Mice like water"],"answer":0,"why":"История показывает, что размер не определяет способность помочь."}],"phrases":{"let me go":{"en":"let someone go","ru":"отпустить"},"runs away":{"en":"run away","ru":"убегать"},"get out":{"en":"get out","ru":"выбраться"},"calls for help":{"en":"call for help","ru":"звать на помощь"}},"gloss":{"hand":{"en":"hand","ru":"лапа"},"can":{"en":"can","ru":"мочь; уметь"},"one":{"en":"one","ru":"один; однажды (one day)"},"over":{"en":"over","ru":"по; через"},"thing":{"en":"thing","ru":"дело; поступок"},"works":{"en":"work","ru":"работать"}},"author":"Wordly · самостоятельный текст","levelNote":"Редакторская оценка сложности, не сертификат CEFR","paragraphs":["A lion sleeps under a tree. A little mouse runs over his foot. The lion opens his eyes. He catches the mouse.","\"Please let me go,\" says the mouse. \"I can help you one day.\"","The lion laughs. \"You are very small. I am very big. How can you help me?\" But he opens his hand, and the mouse runs away.","One day, the lion is in a net. He cannot move. He calls for help. The mouse hears him and comes to the tree.","\"I can help,\" says the mouse. She bites the net with her small teeth. She works and works. Now there is a hole in the net. The lion can get out.","\"Thank you, my friend,\" he says. The mouse smiles. A small friend can do a big thing."],"wordCount":133},{"id":"a1-chess","level":"A1","title":"A Game in the Park","ru":"Игра в парке","genre":"История","focus":"Present Simple · увлечения","text":"Dan likes chess. On Saturday, he takes his chess set to the park. There is a big table near the trees. A woman sits there with a book. Her name is Eva.\n\n\"Do you play chess?\" Dan asks.\n\n\"Yes, but I am a beginner,\" Eva says.\n\nDan puts the pieces on the board. He has the white pieces. Eva has the black pieces. They start a game. Dan moves a pawn. Eva moves a pawn too.\n\nEva looks at the board for a long time. Dan waits. He does not tell her what to do. Then she moves her knight.\n\nThe game is slow. They have no clock. They talk and drink water. At the end, Eva wins. Dan smiles. \"Another game?\" he asks. Eva closes her book. \"Yes, please!\"","questions":[{"q":"Which pieces does Eva have?","options":["White","Black","Both colours"],"answer":1,"why":"Eva has the black pieces."},{"q":"What does Dan do while Eva thinks?","options":["He waits","He moves her knight","He starts a clock"],"answer":0,"why":"Dan waits; he does not tell her what to do."},{"q":"What happens at the end?","options":["Dan leaves","Eva reads aloud","They agree to play again"],"answer":2,"why":"Dan предлагает Another game, Eva соглашается."}],"phrases":{"chess set":{"en":"chess set","ru":"набор для игры в шахматы"},"for a long time":{"en":"for a long time","ru":"долго"},"at the end":{"en":"at the end","ru":"в конце"}},"gloss":{"pieces":{"en":"piece","ru":"шахматная фигура"},"set":{"en":"set","ru":"набор"},"moves":{"en":"move","ru":"двигать; делать ход"},"white":{"en":"white","ru":"белый"},"black":{"en":"black","ru":"чёрный"},"end":{"en":"end","ru":"конец"},"long":{"en":"long","ru":"долгий"},"clock":{"en":"clock","ru":"шахматные часы"}},"author":"Wordly · самостоятельный текст","levelNote":"Редакторская оценка сложности, не сертификат CEFR","paragraphs":["Dan likes chess. On Saturday, he takes his chess set to the park. There is a big table near the trees. A woman sits there with a book. Her name is Eva.","\"Do you play chess?\" Dan asks.","\"Yes, but I am a beginner,\" Eva says.","Dan puts the pieces on the board. He has the white pieces. Eva has the black pieces. They start a game. Dan moves a pawn. Eva moves a pawn too.","Eva looks at the board for a long time. Dan waits. He does not tell her what to do. Then she moves her knight.","The game is slow. They have no clock. They talk and drink water. At the end, Eva wins. Dan smiles. \"Another game?\" he asks. Eva closes her book. \"Yes, please!\""],"wordCount":130},{"id":"b2-letter","level":"B2","title":"The Wrong Envelope","ru":"Не тот конверт","genre":"Рассказ","focus":"Past Simple / Past Perfect · порядок событий","text":"When Alex opened the envelope, he expected an electricity bill. Instead, he found a handwritten letter beginning, \"Thank you for listening when nobody else would.\" He checked the address. The house number was correct, but the name belonged to someone he had never met.\n\nAlex had moved into the flat three months earlier. The previous tenant had left a broken lamp and a cupboard full of empty jars, but no forwarding address. Alex put the letter on the kitchen table. He knew he should not read any further. Still, the first sentence stayed in his mind throughout the morning.\n\nThat afternoon, he visited the little bookshop across the street. The owner, Ruth, remembered the previous tenant. She explained that he had volunteered at a local support group before moving away. She did not know his new address, but offered to contact the group. Alex gave her the envelope without discussing its contents.\n\nA week passed. Every time Alex entered the shop, Ruth shook her head. Then, on Friday, she handed him a small card. \"We found him,\" she said. \"He asked me to thank you for making the effort.\" Alex felt relieved. The private letter had reached the person who was meant to receive it.\n\nHe was about to leave when he noticed a notice beside the door. The support group needed someone to help serve tea on Wednesday evenings. Alex had often complained that he knew nobody in the neighbourhood. Now there was an opportunity to change that. He wrote down the number.\n\nAt his first meeting, he expected to spend the evening washing cups. He did wash plenty of cups, but he also listened. One visitor talked about a difficult move; another described a job interview that had gone badly. Alex did not have useful advice for everyone. He discovered that he did not always need it.\n\nRuth later told him that the group had needed help for a long time. There had been other notices in the window, but Alex had walked past them without looking. The letter had not created a new opportunity; it had made an existing one easier to see.\n\nMonths later, an envelope arrived with his own name on it. This time he opened it without hesitation. It contained a short note from the group and an invitation to a summer picnic. It was not a dramatic reward. Yet Alex placed it on the kitchen table and left it there for several days.","questions":[{"q":"Why does Alex visit Ruth?","options":["To buy empty jars","To help the letter reach its intended recipient","To ask her to read the letter"],"answer":1,"why":"Он ищет контакт прежнего жильца; содержание письма не обсуждает."},{"q":"What changes after Alex sees the notice?","options":["He decides to volunteer","He moves out","He stops visiting the shop"],"answer":0,"why":"Alex записывает номер и приходит помогать группе."},{"q":"What does Alex learn at the meeting?","options":["Advice is always necessary","Everyone needs a job interview","Listening itself can be useful"],"answer":2,"why":"Он обнаруживает, что полезный совет нужен не всегда."}],"phrases":{"forwarding address":{"en":"forwarding address","ru":"адрес для пересылки корреспонденции"},"shook her head":{"en":"shake one’s head","ru":"покачать головой"},"was about to":{"en":"be about to","ru":"собираться вот-вот сделать"},"wrote down":{"en":"write down","ru":"записать"},"making the effort": ","At his first meeting, he expected to spend the evening washing cups. He did wash plenty of cups, but he also listened. One visitor talked about a difficult move; another described a job interview that had gone badly. Alex did not have useful advice for everyone. He discovered that he did not always need it.","Ruth later told him that the group had needed help for a long time. There had been other notices in the window, but Alex had walked past them without looking. The letter had not created a new opportunity; it had made an existing one easier to see.","Months later, an envelope arrived with his own name on it. This time he opened it without hesitation. It contained a short note from the group and an invitation to a summer picnic. It was not a dramatic reward. Yet Alex placed it on the kitchen table and left it there for several days."],"wordCount":410},{"id":"b2-train","level":"B2","title":"The Last Train Home","ru":"Последний поезд домой","genre":"Рассказ","focus":"Past Continuous · фон и событие","text":"The last train was standing at platform four when Nina reached the station. Its doors were open, but she did not get on immediately. A man beside the ticket machine was trying to explain something to a railway employee. He kept pointing at his phone. The employee looked worried.\n\nNina had ten minutes before departure. She asked whether she could help. The man, Tomas, was travelling to a village beyond the final station. His daughter had arranged to meet him, but his phone battery had died. He had written her number on a piece of paper and then lost the paper somewhere between the bus stop and the ticket machine.\n\nThe employee offered to let him use the station telephone, but Tomas could not remember the number. He remembered the name of the small hotel where his daughter worked. Nina searched for it on her own phone. There were three hotels with similar names. The first was in another country. The second had closed. At the third, a receptionist recognised his daughter's name.\n\nWhile Tomas was speaking to the receptionist, the departure board changed. The train would leave in two minutes. Nina hurried towards the platform, assuming that Tomas would follow. Halfway there, she turned around. He was still at the ticket machine, looking at his ticket and then at two different signs.\n\nNina went back. \"Platform four,\" she said, showing him the number. They walked together, and the railway employee held the door while Tomas found a seat. Nina sat opposite him. Only when the train began to move did she notice how fast her heart was beating.\n\nThey did not talk much during the journey. Tomas showed her a photograph of his daughter, and Nina told him about the town where she lived. At the last station, a young woman was waiting under a bright yellow umbrella. Tomas waved through the window.\n\nThe next morning, Nina thought about the railway employee too. Without his help, finding a hotel would not have been enough. The evening had depended on several people doing small, ordinary things. She wrote a short message to the station to thank the staff.\n\nOn the way out, Nina checked the time of her connecting bus. She had assumed that helping Tomas had made her late. In fact, her bus was delayed by fifteen minutes. She bought a hot drink and sat down. For once, waiting did not feel like wasted time. She had not saved a life or solved a huge problem. She had simply had ten minutes and used them.","questions":[{"q":"Why can Tomas not call his daughter?","options":["He has no ticket","His battery is dead and the number is missing","His daughter has no phone"],"answer":1,"why":"Телефон разрядился, а записанный номер потерян."},{"q":"Why does Nina turn back?","options":["Tomas is confused about the platform","She wants another ticket","The train has left"],"answer":0,"why":"Она видит, что Tomas всё ещё смотрит на билет и указатели."},{"q":"What is the ending mainly about?","options":["All buses are late","Helping always brings a reward","A small use of time can matter"],"answer":2,"why":"Финал подчёркивает ценность небольшого поступка, а не гарантированную награду."}],"phrases":{"get on":{"en":"get on","ru":"сесть в транспорт"},"turned around":{"en":"turn around","ru":"обернуться"},"went back":{"en":"go back","ru":"вернуться"},"in fact":{"en":"in fact","ru":"на самом деле"},"for once":{"en":"for once","ru":"на этот раз, в кои-то веки"}},"gloss":{"connecting":{"en":"connecting","ru":"следующий для пересадки"},"held":{"en":"hold","ru":"удерживать"},"following":{"en":"follow","ru":"идти следом"},"dead":{"en":"dead","ru":"разряженный"},"signs":{"en":"sign","ru":"указатель"},"employee":{"en":"employee","ru":"сотрудник"},"last":{"en":"last","ru":"последний"},"final":{"en":"final","ru":"конечный"},"turn":{"en":"turn","ru":"оборачиваться"},"train":{"en":"train","ru":"поезд"}},"author":"Wordly · самостоятельный текст","levelNote":"Редакторская оценка сложности, не сертификат CEFR","paragraphs":["The last train was standing at platform four when Nina reached the station. Its doors were open, but she did not get on immediately. A man beside the ticket machine was trying to explain something to a railway employee. He kept pointing at his phone. The employee looked worried.","Nina had ten minutes before departure. She asked whether she could help. The man, Tomas, was travelling to a village beyond the final station. His daughter had arranged to meet him, but his phone battery had died. He had written her number on a piece of paper and then lost the paper somewhere between the bus stop and the ticket machine.","The employee offered to let him use the station telephone, but Tomas could not remember the number. He remembered the name of the small hotel where his daughter worked. Nina searched for it on her own phone. There were three hotels with similar names. The first was in another country. The second had closed. At the third, a receptionist recognised his daughter's name.","While Tomas was speaking to the receptionist, the departure board changed. The train would leave in two minutes. Nina hurried towards the platform, assuming that Tomas would follow. Halfway there, she turned around. He was still at the ticket machine, looking at his ticket and then at two different signs.","Nina went back. \"Platform four,\" she said, showing him the number. They walked together, and the railway employee held the door while Tomas found a seat. Nina sat opposite him. Only when the train began to move did she notice how fast her heart was beating.","They did not talk much during the journey. Tomas showed her a photograph of his daughter, and Nina told him about the town where she lived. At the last station, a young woman was waiting under a bright yellow umbrella. Tomas waved through the window.","The next morning, Nina thought about the railway employee too. Without his help, finding a hotel would not have been enough. The evening had depended on several people doing small, ordinary things. She wrote a short message to the station to thank the staff.","On the way out, Nina checked the time of her connecting bus. She had assumed that helping Tomas had made her late. In fact, her bus was delayed by fifteen minutes. She bought a hot drink and sat down. For once, waiting did not feel like wasted time. She had not saved a life or solved a huge problem. She had simply had ten minutes and used them."],"wordCount":426},{"id":"b2-habit","level":"B2","title":"A Place for the New Habit","ru":"Место для новой привычки","genre":"Статья","focus":"Present Simple · объяснение причин","text":"People often describe a new habit as a test of determination. They decide to read every evening, practise a language or go for a walk before breakfast. For a few days, enthusiasm makes the plan feel easy. Then an ordinary busy day arrives, and the plan disappears. It is tempting to conclude that the person simply lacks discipline.\n\nThere may be a more practical explanation. The habit has no clear place in the person's existing routine. \"I will practise English more\" does not say when the practice begins, where it happens or what the first action is. When every session requires a fresh decision, the person has to solve the same planning problem again and again.\n\nA smaller, more specific plan removes some of that uncertainty. For example: \"After I put my breakfast plate in the sink, I will review five words at the kitchen table.\" The existing action becomes a reminder. The number of words is small enough for a difficult morning. On a quiet day, the learner can continue, but continuing is a choice rather than a condition for success.\n\nThe surroundings matter too. A book beside the bed is easier to notice than a book buried in a cupboard. A language app on the first phone screen is easier to open than one hidden inside several folders. These changes do not create motivation from nothing. They simply reduce the work needed to start.\n\nNone of this means that every interruption can be prevented. Illness, travel and family responsibilities can break a routine. A useful plan includes a way to return. Missing one evening need not become evidence that the entire project has failed. The next available moment can be a new beginning, not a punishment.\n\nIt is also worth asking what the habit is for. Someone who wants to understand conversations may need different practice from someone preparing for an exam. Counting minutes alone does not tell us whether the practice serves that purpose. A short session with attention can be more relevant than a long session spent repeating familiar material automatically.\n\nFor a week, a learner can record not only the minutes spent but the conditions that made starting easy or difficult. Perhaps the kitchen is too busy, or the chosen moment keeps changing. That information gives the plan a chance to improve instead of turning every difficulty into a personal failure.\n\nA habit, then, is not only a promise about future behaviour. It is a small arrangement between a goal, a moment and a place. That arrangement should be easy to begin, useful while it lasts and possible to restart. Determination still helps, but it does not have to do all the work.","questions":[{"q":"What problem does a vague plan create?","options":["It requires a new planning decision each time","It makes every session too short","It always prevents motivation"],"answer":0,"why":"Без момента и первого действия приходится снова решать, как начать."},{"q":"What is the purpose of five words in the example?","options":["To set a universal learning limit","To make a start manageable on busy days","To replace all lessons"],"answer":1,"why":"Небольшой объём позволяет начать даже в трудное утро."},{"q":"What should happen after an interruption?","options":["A punishment","A permanent stop","A practical return to the routine"],"answer":2,"why":"Текст предлагает заранее продумать возвращение, а не наказание."}],"phrases":{"again and again":{"en":"again and again","ru":"снова и снова"},"rather than":{"en":"rather than","ru":"а не; вместо"},"worth asking":{"en":"worth asking","ru":"стоит спросить"},"from nothing":{"en":"from nothing","ru":"из ничего"}},"gloss":{"discipline":{"en":"discipline","ru":"самодисциплина"},"familiar":{"en":"familiar","ru":"уже знакомый"},"attention":{"en":"attention","ru":"внимательное отношение"},"condition":{"en":"condition","ru":"условие"},"plate":{"en":"plate","ru":"тарелка"},"sink":{"en":"sink","ru":"раковина"},"work":{"en":"work","ru":"усилия"},"promises":{"en":"promise","ru":"обещание"},"arrangement":{"en":"arrangement","ru":"согласованное устройство; организация"}},"author":"Wordly · самостоятельный текст","levelNote":"Редакторская оценка сложности, не сертификат CEFR","paragraphs":["People often describe a new habit as a test of determination. They decide to read every evening, practise a language or go for a walk before breakfast. For a few days, enthusiasm makes the plan feel easy. Then an ordinary busy day arrives, and the plan disappears. It is tempting to conclude that the person simply lacks discipline.","There may be a more practical explanation. The habit has no clear place in the person's existing routine. \"I will practise English more\" does not say when the practice begins, where it happens or what the first action is. When every session requires a fresh decision, the person has to solve the same planning problem again and again.","A smaller, more specific plan removes some of that uncertainty. For example: \"After I put my breakfast plate in the sink, I will review five words at the kitchen table.\" The existing action becomes a reminder. The number of words is small enough for a difficult morning. On a quiet day, the learner can continue, but continuing is a choice rather than a condition for success.","The surroundings matter too. A book beside the bed is easier to notice than a book buried in a cupboard. A language app on the first phone screen is easier to open than one hidden inside several folders. These changes do not create motivation from nothing. They simply reduce the work needed to start.","None of this means that every interruption can be prevented. Illness, travel and family responsibilities can break a routine. A useful plan includes a way to return. Missing one evening need not become evidence that the entire project has failed. The next available moment can be a new beginning, not a punishment.","It is also worth asking what the habit is for. Someone who wants to understand conversations may need different practice from someone preparing for an exam. Counting minutes alone does not tell us whether the practice serves that purpose. A short session with attention can be more relevant than a long session spent repeating familiar material automatically.","For a week, a learner can record not only the minutes spent but the conditions that made starting easy or difficult. Perhaps the kitchen is too busy, or the chosen moment keeps changing. That information gives the plan a chance to improve instead of turning every difficulty into a personal failure.","A habit, then, is not only a promise about future behaviour. It is a small arrangement between a goal, a moment and a place. That arrangement should be easy to begin, useful while it lasts and possible to restart. Determination still helps, but it does not have to do all the work."],"wordCount":448},{"id":"b2-repair","level":"B2","title":"The Saturday Repair Table","ru":"Субботний ремонтный стол","genre":"Статья-история","focus":"Present Perfect · результат опыта","text":"The town library has started an unusual Saturday activity. Between the newspaper shelves and the large windows, volunteers have set up a repair table. Visitors bring small objects that no longer work: lamps, bags, toys and kitchen tools. The volunteers do not promise to repair everything. They promise to examine the problem with the owner.\n\nAt the first session, most visitors expected to leave their belongings and collect them later. The organisers explained that this was not a free repair shop. The owners would stay, ask questions and, when it was safe, help with the repair. A few people left. Others pulled up chairs.\n\nOne of them was Omar, who had brought a desk lamp. He had already bought a replacement, but had not thrown the old lamp away. A volunteer checked the cable and found a loose connection. Omar watched closely as she explained why the power had to be switched off before any work began. They repaired the connection together. Electrical work at the table is handled only by volunteers with suitable training.\n\nNot every object could be repaired. A child's toy needed a part that nobody had. A badly damaged bag would have cost more to repair than to replace. The volunteers explained these limits instead of hiding them. They wrote down the missing part for the toy and suggested using the bag's strong fabric for another purpose.\n\nThe activity has changed the atmosphere of the library on Saturdays. People who rarely spoke to one another now compare stories about objects they have owned for years. An old radio is not just a radio; it may remind its owner of a first flat or a parent. Repair can preserve that connection as well as save a useful object.\n\nThe organisers are careful about their claims. They have not measured the project's full environmental effect, and a repaired object can still consume energy or require new materials. What they can count is more modest: objects examined, repairs completed and skills shared. They also record failures, because a future volunteer may learn from them.\n\nOmar now helps welcome visitors. He does not repair electrical equipment himself. Instead, he asks what has happened to each object and writes down the owner's explanation. His lamp is working again, but that is not the only result. He has found a place where asking how something works is a reason to stay, not a reason to feel embarrassed.","questions":[{"q":"What is different about the repair table?","options":["Owners take part rather than just leave objects","Every object is guaranteed to be repaired","Only new objects are accepted"],"answer":0,"why":"Владельцы остаются, задают вопросы и участвуют, когда это безопасно."},{"q":"Who handles electrical work?","options":["Any visitor","Suitably trained volunteers","Omar alone"],"answer":1,"why":"Текст прямо ограничивает электромонтаж обученными волонтёрами."},{"q":"Which claim do the organisers avoid?","options":["They record completed repairs","They share skills","They know the full environmental effect"],"answer":2,"why":"Полный экологический эффект проекта пока не измерен."}],"phrases":{"set up":{"en":"set up","ru":"организовать; установить"},"no longer":{"en":"no longer","ru":"больше не"},"switched off":{"en":"switch off","ru":"выключить"},"as well as":{"en":"as well as","ru":"а также"},"thrown the old lamp away":{"en":"throw away","ru":"выбросить"}},"gloss":{"connection":{"en":"connection","ru":"соединение"},"part":{"en":"part","ru":"деталь"},"parts":{"en":"part","ru":"деталь"},"table":{"en":"table","ru":"рабочий стол"},"examined":{"en":"examine","ru":"осмотреть"},"power":{"en":"power","ru":"электропитание"},"training":{"en":"training","ru":"обучение"},"strong":{"en":"strong","ru":"прочный"},"cost":{"en":"cost","ru":"стоить"},"record":{"en":"record","ru":"записывать"},"failed":{"en":"fail","ru":"не удаться"}},"author":"Wordly · самостоятельный текст","levelNote":"Редакторская оценка сложности, не сертификат CEFR","paragraphs":["The town library has started an unusual Saturday activity. Between the newspaper shelves and the large windows, volunteers have set up a repair table. Visitors bring small objects that no longer work: lamps, bags, toys and kitchen tools. The volunteers do not promise to repair everything. They promise to examine the problem with the owner.","At the first session, most visitors expected to leave their belongings and collect them later. The organisers explained that this was not a free repair shop. The owners would stay, ask questions and, when it was safe, help with the repair. A few people left. Others pulled up chairs.","One of them was Omar, who had brought a desk lamp. He had already bought a replacement, but had not thrown the old lamp away. A volunteer checked the cable and found a loose connection. Omar watched closely as she explained why the power had to be switched off before any work began. They repaired the connection together. Electrical work at the table is handled only by volunteers with suitable training.","Not every object could be repaired. A child's toy needed a part that nobody had. A badly damaged bag would have cost more to repair than to replace. The volunteers explained these limits instead of hiding them. They wrote down the missing part for the toy and suggested using the bag's strong fabric for another purpose.","The activity has changed the atmosphere of the library on Saturdays. People who rarely spoke to one another now compare stories about objects they have owned for years. An old radio is not just a radio; it may remind its owner of a first flat or a parent. Repair can preserve that connection as well as save a useful object.","The organisers are careful about their claims. They have not measured the project's full environmental effect, and a repaired object can still consume energy or require new materials. What they can count is more modest: objects examined, repairs completed and skills shared. They also record failures, because a future volunteer may learn from them.","Omar now helps welcome visitors. He does not repair electrical equipment himself. Instead, he asks what has happened to each object and writes down the owner's explanation. His lamp is working again, but that is not the only result. He has found a place where asking how something works is a reason to stay, not a reason to feel embarrassed."],"wordCount":405},{"id":"b2-chess","level":"B2","title":"Before You Move","ru":"Прежде чем сделать ход","genre":"Статья","focus":"Conditionals · последствия решения","text":"A chess player can spend several minutes finding an attractive move and then lose a piece immediately after making it. The problem is not always a lack of knowledge. Sometimes the player has answered only one question: \"What do I want to do?\" The equally important question, \"What can my opponent do next?\", has been forgotten.\n\nConsider a position in which a knight can attack two pieces at once. The idea looks promising, so the player begins to calculate the possible gains. But if the opponent can capture the queen with check, the attack may not matter at all. An appealing plan can hide a more urgent problem.\n\nOne useful approach is to pause before committing to a move. The pause need not be long. First, check whether your king is in danger. Then look for the opponent's checks, captures and direct threats after the move you are considering. Finally, ask whether the piece you intend to move is protecting something important. These questions do not guarantee the best move, but they may reveal an obvious mistake.\n\nThe same approach can be used after a game. Instead of writing \"I played badly\", identify the moment when a question was missed. Perhaps you calculated an attack but never checked the opponent's reply. Perhaps you moved a defender because you looked only at its destination. A specific explanation offers something to practise; a general insult does not.\n\nPractice can be simple. Take a position from one of your own games. Before searching for a winning move, write down two threats for each side. Then compare your list with the actual continuation. If you missed a threat, try to describe what made it difficult to see. Was the attacking piece far away? Was a line blocked before the previous move?\n\nThere is a danger in turning a helpful checklist into a rigid ritual. In a fast game, you cannot examine every possibility in detail. Experience helps you notice which questions deserve attention. The purpose of the checklist is to build that awareness, not to make every move painfully slow.\n\nA good decision is not defined only by whether it succeeds. You may choose a reasonable move and still lose to stronger play. You may also win after overlooking a serious threat. Reviewing the decision process, rather than only the result, makes both kinds of game useful. Before you move, leave room for the other player's answer.","questions":[{"q":"Which question is often forgotten?","options":["What can my opponent do next?","What colour are my pieces?","Where is the board?"],"answer":0,"why":"Текст противопоставляет собственный план и ответ соперника."},{"q":"What is useful after a mistake?","options":["A general insult","A specific explanation of the missed question","Ignoring the position"],"answer":1,"why":"Конкретная причина даёт направление для тренировки."},{"q":"Why is winning not proof of a good decision?","options":["The rules change","The clock is optional","A player can win despite missing a serious threat"],"answer":2,"why":"Победа возможна даже после ошибочного расчёта."}],"phrases":{"at once":{"en":"at once","ru":"одновременно"},"at all":{"en":"at all","ru":"вообще"},"in detail":{"en":"in detail","ru":"подробно"},"rather than":{"en":"rather than","ru":"а не"},"write down":{"en":"write down","ru":"записать"}},"gloss":{"check":{"en":"check","ru":"шах; проверять"},"checks":{"en":"check","ru":"шах"},"captures":{"en":"capture","ru":"взятие фигуры"},"piece":{"en":"piece","ru":"шахматная фигура"},"pieces":{"en":"piece","ru":"шахматная фигура"},"knight":{"en":"knight","ru":"конь"},"queen":{"en":"queen","ru":"ферзь"},"king":{"en":"king","ru":"король"},"square":{"en":"square","ru":"поле шахматной доски"},"gains":{"en":"gain","ru":"материальный выигрыш"},"line":{"en":"line","ru":"линия доски"},"destination":{"en":"destination","ru":"поле назначения"},"reply":{"en":"reply","ru":"ответный ход"}},"author":"Wordly · самостоятельный текст","levelNote":"Редакторская оценка сложности, не сертификат CEFR","paragraphs":["A chess player can spend several minutes finding an attractive move and then lose a piece immediately after making it. The problem is not always a lack of knowledge. Sometimes the player has answered only one question: \"What do I want to do?\" The equally important question, \"What can my opponent do next?\", has been forgotten.","Consider a position in which a knight can attack two pieces at once. The idea looks promising, so the player begins to calculate the possible gains. But if the opponent can capture the queen with check, the attack may not matter at all. An appealing plan can hide a more urgent problem.","One useful approach is to pause before committing to a move. The pause need not be long. First, check whether your king is in danger. Then look for the opponent's checks, captures and direct threats after the move you are considering. Finally, ask whether the piece you intend to move is protecting something important. These questions do not guarantee the best move, but they may reveal an obvious mistake.","The same approach can be used after a game. Instead of writing \"I played badly\", identify the moment when a question was missed. Perhaps you calculated an attack but never checked the opponent's reply. Perhaps you moved a defender because you looked only at its destination. A specific explanation offers something to practise; a general insult does not.","Practice can be simple. Take a position from one of your own games. Before searching for a winning move, write down two threats for each side. Then compare your list with the actual continuation. If you missed a threat, try to describe what made it difficult to see. Was the attacking piece far away? Was a line blocked before the previous move?","There is a danger in turning a helpful checklist into a rigid ritual. In a fast game, you cannot examine every possibility in detail. Experience helps you notice which questions deserve attention. The purpose of the checklist is to build that awareness, not to make every move painfully slow.","A good decision is not defined only by whether it succeeds. You may choose a reasonable move and still lose to stronger play. You may also win after overlooking a serious threat. Reviewing the decision process, rather than only the result, makes both kinds of game useful. Before you move, leave room for the other player's answer."],"wordCount":403},{"id":"c1-memory","level":"C1","title":"The Version We Remember","ru":"Версия, которую мы помним","genre":"Эссе","focus":"Оговорки · различие факта и интерпретации","text":"At a family dinner, two sisters begin telling the story of a journey they took as children. They agree on the destination, the heavy rain and the broken car. Beyond that, their accounts diverge. One remembers their father making jokes while they waited for help. The other remembers an anxious silence. Neither is deliberately inventing the scene. Yet each finds the other's confidence faintly irritating.\n\nIt is tempting to treat this disagreement as a contest with a single winner. If memory were an untouched recording, one account would be accurate and the other defective. In ordinary life, however, remembering involves more than retrieving stored details. We connect fragments, interpret motives and place an event within the story we currently tell about ourselves. The resulting account may contain genuine details while still being incomplete.\n\nConsider what the sisters attended to during the journey. One might have watched her father's face, hoping for reassurance. The other might have watched the road, worried that the family would miss a promised visit. Their attention was directed towards different parts of the same event. Later conversations could have strengthened some details and allowed others to fade. A story frequently repeated can become familiar without every element becoming more reliable.\n\nThis does not imply that memory is useless, or that every recollection deserves equal weight. A diary written that evening, a photograph or an independent account may provide evidence. Such evidence still requires interpretation: a smiling face in a photograph does not prove that everyone felt relaxed throughout the day. Nevertheless, it can constrain what we reasonably claim. The useful distinction is between uncertainty and complete indifference to evidence.\n\nOur reasons for remembering also matter. A person recalling a difficult period may be trying to explain how they changed, rather than establish the exact order of events. A listener seeking a factual timetable may therefore ask questions that seem unexpectedly hostile. The disagreement is partly about the past and partly about what the conversation is supposed to accomplish. Recognising that difference can make the exchange less defensive without making it less honest.\n\nThere are consequences for keeping personal records. A useful note need not be polished into a complete narrative. It can separate observation from interpretation: \"The meeting ended after ten minutes\" is different from \"They wanted to dismiss my idea.\" The second statement may be a reasonable interpretation, but recording it as such leaves room for revision. Otherwise, a conclusion can later return disguised as something directly observed.\n\nThe same caution applies to learning. After a difficult language exercise, a learner may remember only the errors and conclude that nothing was understood. A record of individual answers can reveal a less dramatic picture: several constructions were handled well, while one contrast repeatedly caused trouble. The record is not a judgement of the person. It is evidence about a particular attempt under particular conditions.\n\nThere is also a social risk in correcting every uncertain detail. When a friend tells a story, the purpose may be connection rather than verification. Interrupting to dispute the colour of a coat may add little, especially if the detail has no bearing on the point. But restraint should not become an excuse to accept harmful or consequential claims without question. The relevance of a detail depends on what rests upon it.\n\nAt the family table, the sisters eventually stop arguing about who has the authentic version. They ask their father what he recalls. He remembers neither jokes nor silence, but a leaking bag of oranges. The unexpected detail does not settle the dispute. It broadens the scene. What had seemed a competition between two complete records becomes a comparison between three partial perspectives.\n\nRevising a memory can also feel like revising a relationship. If a familiar story changes, we may worry that the people inside it will change too. Yet recognising another perspective need not remove affection or responsibility. It may instead give each person more space within a shared history. The uncertainty belongs to the account of the event, not necessarily to the value of the relationship itself.\n\nPerhaps a careful relationship with memory begins there: not with distrust of everything we remember, but with a willingness to distinguish vividness from certainty. We can value a recollection, investigate it when necessary and acknowledge its limits. A personal history need not lose its meaning simply because its narrator is capable of revising it.","questions":[{"q":"What distinction does the essay defend?","options":["Uncertainty versus indifference to evidence","Memory versus all written records","Truth versus every personal story"],"answer":0,"why":"Неуверенность не означает, что доказательства больше не важны."},{"q":"Why separate observation and interpretation in notes?","options":["To remove all emotion","To leave room for revising a conclusion","To make notes longer"],"answer":1,"why":"Иначе интерпретация позже может восприниматься как прямое наблюдение."},{"q":"What does the father’s detail do?","options":["Proves one sister lied","Settles the order of events","Adds another partial perspective"],"answer":2,"why":"Деталь расширяет сцену, не решая спор окончательно."}],"phrases":{"equal weight":{"en":"equal weight","ru":"одинаковый вес; равная значимость"},"leaves room for":{"en":"leave room for","ru":"оставлять возможность для"},"has no bearing on":{"en":"have no bearing on","ru":"не иметь отношения к; не влиять на"},"rests upon":{"en":"rest upon","ru":"зависеть от; опираться на"},"rather than":{"en":"rather than","ru":"а не"}},"gloss":{"accounts":{"en":"account","ru":"рассказы; версии событий"},"account":{"en":"account","ru":"рассказ; версия событий"},"record":{"en":"record","ru":"запись"},"records":{"en":"record","ru":"записи"},"weight":{"en":"weight","ru":"значимость"},"hostile":{"en":"hostile","ru":"враждебный"},"bearing":{"en":"bearing","ru":"отношение к; влияние на"},"rests":{"en":"rest","ru":"зависеть"},"constructions":{"en":"construction","ru":"грамматические конструкции"},"handled":{"en":"handle","ru":"справиться с"},"close":{"en":"close","ru":"близкий"},"last":{"en":"last","ru":"последний"},"table":{"en":"table","ru":"стол"},"authentic":{"en":"authentic","ru":"подлинный"},"like":{"en":"like","ru":"как; подобно"}},"author":"Wordly · самостоятельный текст","levelNote":"Редакторская оценка сложности, не сертификат CEFR","paragraphs":["At a family dinner, two sisters begin telling the story of a journey they took as children. They agree on the destination, the heavy rain and the broken car. Beyond that, their accounts diverge. One remembers their father making jokes while they waited for help. The other remembers an anxious silence. Neither is deliberately inventing the scene. Yet each finds the other's confidence faintly irritating.","It is tempting to treat this disagreement as a contest with a single winner. If memory were an untouched recording, one account would be accurate and the other defective. In ordinary life, however, remembering involves more than retrieving stored details. We connect fragments, interpret motives and place an event within the story we currently tell about ourselves. The resulting account may contain genuine details while still being incomplete.","Consider what the sisters attended to during the journey. One might have watched her father's face, hoping for reassurance. The other might have watched the road, worried that the family would miss a promised visit. Their attention was directed towards different parts of the same event. Later conversations could have strengthened some details and allowed others to fade. A story frequently repeated can become familiar without every element becoming more reliable.","This does not imply that memory is useless, or that every recollection deserves equal weight. A diary written that evening, a photograph or an independent account may provide evidence. Such evidence still requires interpretation: a smiling face in a photograph does not prove that everyone felt relaxed throughout the day. Nevert ntic version. They ask their father what he recalls. He remembers neither jokes nor silence, but a leaking bag of oranges. The unexpected detail does not settle the dispute. It broadens the scene. What had seemed a competition between two complete records becomes a comparison between three partial perspectives.","Revising a memory can also feel like revising a relationship. If a familiar story changes, we may worry that the people inside it will change too. Yet recognising another perspective need not remove affection or responsibility. It may instead give each person more space within a shared history. The uncertainty belongs to the account of the event, not necessarily to the value of the relationship itself.","Perhaps a careful relationship with memory begins there: not with distrust of everything we remember, but with a willingness to distinguish vividness from certainty. We can value a recollection, investigate it when necessary and acknowledge its limits. A personal history need not lose its meaning simply because its narrator is capable of revising it."],"wordCount":732},{"id":"c1-silence","level":"C1","title":"The Minutes of the Meeting","ru":"Протокол собрания","genre":"Рассказ","focus":"Подтекст · точка зрения рассказчика","text":"The minutes said that the committee had agreed unanimously. I remember writing that sentence, although I no longer remember whether anyone asked me to use the word. It fitted neatly into the space beneath the agenda item. A shorter sentence would have left the page looking unfinished.\n\nWe were deciding whether to close the little reading room on the ground floor. The building manager had presented a list of costs: heating, cleaning, a lock that repeatedly needed replacing. Only a handful of residents used the room regularly. A storage company had offered to rent it. The figures were clear enough, and I had arranged them in a table before the meeting began.\n\nOur chair, Martin, asked whether anyone objected. Nobody raised a hand. He looked around the table and moved on to the next item. I recorded an agreement. At the time, I considered this an accurate description of what had happened. The question had been asked; no objection had been expressed. It was not my responsibility to invent one.\n\nTwo days later, I met Mrs Vale beside the lifts. She thanked me for taking the minutes and asked when the reading room would reopen. I explained that it would not. She held her shopping bag against her coat and looked at the floor. \"I thought we were discussing the repairs,\" she said. \"I did not understand that we had already decided.\"\n\nI wanted to tell her that the agenda had been circulated in advance. In fact, I did tell her. The words sounded less helpful aloud than they had in my head. She nodded and said she must have misunderstood. Then she asked whether the donated books would be thrown away. That question had not appeared anywhere in my carefully arranged table.\n\nBack in my flat, I opened the document. The word \"unanimously\" remained perfectly ordinary on the screen. It did not look like an accusation or a lie. Yet it now seemed to contain information I did not possess. I knew that nobody had raised a hand. I did not know that everyone had understood the proposal in the same way.\n\nI wrote to Martin, suggesting that the minutes should describe the procedure rather than claim complete agreement. He replied that such precision would make a simple decision look controversial. We had followed the rules, he said. If residents did not read the agenda, the committee could not take responsibility for their inattention. His reply was courteous, and I could follow its logic.\n\nFor a day, I considered leaving the sentence unchanged. The storage contract had not yet been signed, but reopening the discussion would create work. I had volunteered to keep records because I liked tasks with clear boundaries. There was a proposal, a vote and a result. Now a conversation beside the lifts had made the boundaries inconveniently uncertain.\n\nAt the next meeting, I asked to clarify the record. Martin sighed, then let me speak. I said that the absence of objections was not necessarily evidence of informed agreement. Mrs Vale explained what she had understood. Another resident admitted that he had been looking for the repair estimate when the question was asked. Someone else said that she supported the closure but wanted a plan for the books.\n\nWe did not save the reading room that evening. The costs were still real, and the building still needed income. We postponed the contract for a month and arranged a separate discussion about alternatives. The final decision might turn out to be exactly the same. What changed was not the arithmetic but the opportunity to understand what was being decided.\n\nAfterwards, Mrs Vale asked whether I regretted taking the task. I said that I did not, although I would ask more questions before the next meeting. She laughed and told me that questions were easier to ask before a decision than after it. I could not put that sentence into the minutes, because the meeting had ended. I wrote it in my own notebook instead.\n\nI took the minutes again. Under the relevant item, I wrote that the proposal had been discussed, that further information was requested and that no final decision had been made. The paragraph was longer than the old sentence. It did not fit neatly into the space I had prepared. For once, I allowed the page to look unfinished.","questions":[{"q":"Why does “unanimously” become a problem?","options":["It is too long","The narrator cannot establish informed agreement","No meeting took place"],"answer":1,"why":"Отсутствие возражений не доказывает одинаковое понимание предложения."},{"q":"Does the second meeting guarantee that the room survives?","options":["Yes","The contract is cancelled permanently","No, the final result may remain the same"],"answer":2,"why":"Изменяется процедура и возможность понять решение, а не обязательно результат."},{"q":"What does the unfinished page suggest?","options":["A preference for accurate complexity over tidy certainty","The narrator stopped writing","The committee lost its records"],"answer":0,"why":"Финал противопоставляет аккуратную уверенность и более точный сложный протокол."}],"phrases":{"in advance":{"en":"in advance","ru":"заранее"},"raised a hand":{"en":"raise a hand","ru":"поднять руку"},"take responsibility":{"en":"take responsibility","ru":"взять на себя ответственность"},"turn out":{"en":"turn out","ru":"оказаться в итоге"},"for once":{"en":"for once","ru":"на этот раз"}},"gloss":{"minutes":{"en":"minutes","ru":"протокол собрания"},"chair":{"en":"chair","ru":"председатель"},"figures":{"en":"figure","ru":"цифра; показатель"},"table":{"en":"table","ru":"таблица"},"hand":{"en":"hand","ru":"рука"},"building":{"en":"building","ru":"здание"},"ground":{"en":"ground","ru":"нижний (ground floor)"},"income":{"en":"income","ru":"доход"},"record":{"en":"record","ru":"протокол; запись"},"recorded":{"en":"record","ru":"зафиксировать"},"agreement":{"en":"agreement","ru":"согласие"},"neatly":{"en":"neatly","ru":"аккуратно"},"word":{"en":"word","ru":"слово"},"unanimously":{"en":"unanimously","ru":"единогласно"},"like":{"en":"like","ru":"как; подобно"}},"author":"Wordly · самостоятельный текст","levelNote":"Редакторская оценка сложности, не сертификат CEFR","paragraphs":["The minutes said that the committee had agreed unanimously. I remember writing that sentence, although I no longer remember whether anyone asked me to use the word. It fitted neatly into the space beneath the agenda item. A shorter sentence would have left the page looking unfinished.","We were deciding whether to close the little reading room on the ground floor. The building manager had presented a list of costs: heating, cleaning, a lock that repeatedly needed replacing. Only a handful of residents used the room regularly. A storage company had offered to rent it. The figures were
